services:
  app:
    build:
      context: .
      dockerfile: docker/preview/Dockerfile
    image: financiera-preview-php
    container_name: financiera-preview-php
    working_dir: /var/www/html
    command: >-
      sh -c "php artisan migrate --force &&
      php artisan optimize &&
      php-fpm -F"
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://192.168.1.17:8081
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      APP_TIMEZONE: America/Managua
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
    volumes:
      - ./database:/var/www/html/database
      - preview_storage:/var/www/html/storage
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: financiera-preview
    ports:
      - "8081:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - preview_storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  preview_storage: