services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: financiera-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_URL: http://localhost:8080
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - financiera

  nginx:
    image: nginx:1.27-alpine
    container_name: financiera-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - financiera

  mysql:
    image: mysql:8.4
    container_name: financiera-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: financiera
      MYSQL_USER: financiera
      MYSQL_PASSWORD: financiera
      TZ: America/Managua
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - financiera

  vite:
    image: node:22-alpine
    container_name: financiera-vite
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
    networks:
      - financiera

networks:
  financiera:
    driver: bridge

volumes:
  mysql_data:
